<VirtualHost *:80>
    ServerName localhost
    UseCanonicalName Off

    # Same layout as production: public_html/ is the web root.
    #   /         -> built frontend (vite build -> public_html/), empty until `make build`
    #   /api/*    -> public_html/api/index.php -> require ../../backend/bootstrap.php
    # The entrypoint copies frontend/public/api/ into public_html/api/ if it's missing.
    DocumentRoot /var/www/html/public_html

    # Make sure the Authorization header (user token) reaches PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html/public_html>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.html [QSA,L]
    </Directory>

    <Directory /var/www/html/public_html/api>
        CGIPassAuth On
        DirectoryIndex index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
