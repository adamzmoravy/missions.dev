<VirtualHost *:80>
    ServerName localhost
    UseCanonicalName Off

    # Built frontend (vite build -> /public_html). Empty until you run `make build`.
    DocumentRoot /var/www/html/public_html

    # The API is always served straight from the source tree, so backend edits are live
    # (frontend/public/api/index.php just requires backend/bootstrap.php).
    Alias /api /var/www/html/frontend/public/api

    # Make sure the Authorization header (user token) reaches PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html/frontend/public/api>
        Options -Indexes
        AllowOverride None
        Require all granted
        CGIPassAuth On
        DirectoryIndex index.php
        FallbackResource /api/index.php
    </Directory>

    <Directory /var/www/html/public_html>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource /index.html
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
